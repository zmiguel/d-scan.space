name: Test & Build

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run svelte-check
        run: npm run check

      - name: Run tests
        run: npm run test

      - name: Build project
        run: BUILD=true npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: build/
          retention-days: 7

  docker-build-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Test Docker build (Main)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=test-build-main
          cache-to: type=gha,mode=max,scope=test-build-main
          platforms: linux/amd64

      - name: Test Docker build (Updater)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: workers/updater/Dockerfile
          push: false
          cache-from: type=gha,scope=test-build-updater
          cache-to: type=gha,mode=max,scope=test-build-updater
          platforms: linux/amd64

  database-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check schema/migration drift
        run: |
          for env in dev preview prod; do
            echo "::group::drizzle-kit generate (DB_ENV=$env)"
            DB_ENV="$env" npx drizzle-kit generate --name=drift-check
            echo "::endgroup::"
            if [ -n "$(git status --porcelain -- drizzle)" ]; then
              echo "::error::Schema changes for DB_ENV=$env are not covered by a committed migration. Run 'npm run db:generate' and commit the result."
              git status --porcelain -- drizzle
              git --no-pager diff -- drizzle
              git ls-files --others --exclude-standard -- drizzle | while read -r f; do
                echo "----- new file: $f -----"
                cat "$f"
              done
              exit 1
            fi
          done

      - name: Apply database migrations
        run: npm run db:migrate
        env:
          DB_ENV: dev

      - name: Re-apply database migrations (idempotency)
        run: npm run db:migrate
        env:
          DB_ENV: dev

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (report only)
        run: npm audit --audit-level moderate
        continue-on-error: true

      - name: Fail if fixable vulnerabilities exist
        run: |
          output=$(npm audit fix --dry-run 2>&1 || true)
          if echo "$output" | grep -Eq "fixed [1-9][0-9]* of [0-9]+ vulnerabilities"; then
            echo "Fixable vulnerabilities found that do not require --force. Run 'npm audit fix' to apply them."
            echo "$output"
            exit 1
          fi
