<!doctype html>
<html class="dark" lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Page-specific tags (title, description, robots, canonical, theme-color, Open Graph)
		     are rendered per route by src/lib/components/MetaTags.svelte. -->
		<meta
			name="keywords"
			content="EVE Online, d-scan, directional scan, local intel, intel tool, EVE intel, scan parser, dscan tool, EVE utilities"
		/>
		<meta name="application-name" content="D-Scan Space" />
		<meta name="color-scheme" content="dark light" />
		<meta name="format-detection" content="telephone=no" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="shortcut icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="D-Scan" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "D-Scan Space!",
				"applicationCategory": "GameApplication",
				"operatingSystem": "Web",
				"description": "EVE Online intel tool for parsing and visualizing directional scans and local chat data.",
				"keywords": "EVE Online, d-scan, directional scan, local intel, intel tool",
				"inLanguage": "en"
			}
		</script>
		<script
			src="https://ry.zm.gl/api/script.js"
			async
			data-site-id="2"
			data-debounce="250"
			data-session-replay="true"
			data-track-errors="true"
			data-web-vitals="true"
		></script>
		<script>
			// Mirrors flowbite-svelte's DarkMode (key "THEME_PREFERENCE_KEY", values "dark"/"light"):
			// apply a saved preference before first paint; without one keep the default dark class.
			try {
				const theme = localStorage.getItem('THEME_PREFERENCE_KEY');
				if (theme !== null) document.documentElement.classList.toggle('dark', theme === 'dark');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body class="bg-gray-100 dark:bg-gray-800" data-sveltekit-preload-data="hover">
		<div>%sveltekit.body%</div>
	</body>
</html>
